# Seed sources (plan §6.6). `sidereal init` inserts rows whose key is missing; it never changes
# existing rows, so edits made in the app (M27) survive a re-seed.
#
# Fields: key, name, kind (rss | msrc | cisa_kev | hn_algolia), url, weight (0.5-1.5),
# max_items (default 50), enabled (default true), options (adapter-specific table).
# options.article_hosts: hosts enrichment may fetch article text from (plan §6.2); empty = none.

[[source]]
key = "azure-updates"
name = "Azure Updates"
kind = "rss"
url = "https://www.microsoft.com/releasecommunications/api/v2/azure/rss"
weight = 1.3
options = { article_hosts = ["azure.microsoft.com", "learn.microsoft.com", "techcommunity.microsoft.com"] }

[[source]]
key = "azure-blog"
name = "Microsoft Azure Blog"
kind = "rss"
url = "https://azure.microsoft.com/en-us/blog/feed/"
